<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Journal</title>
    <style>
        body { background: #111; color: #fff; font-family: system-ui, sans-serif; margin: 0; padding: 2vw; }
        
        /* --- Onglets / Navigation haut --- */
        .tabs { display: flex; justify-content: center; gap: 24px; margin: 20px 0 40px 0; border-bottom: 1px solid #222; padding-bottom: 12px; }
        .tab-link { color: #666; text-decoration: none; font-size: 1.1rem; font-weight: 500; padding: 6px 4px; transition: all 0.2s; border-bottom: 2px solid transparent; }
        .tab-link:hover { color: #fff; }
        .tab-link.active { color: #fff; border-bottom-color: #fff; }

        /* --- Mosaïque --- */
        .masonry { column-count: 1; column-gap: 16px; }
        @media (min-width: 768px) { .masonry { column-count: 2; } }
        @media (min-width: 1024px) { .masonry { column-count: 3; } }
        
        .photo-card { margin-bottom: 24px; break-inside: avoid; display: inline-block; width: 100%; }
        .photo-card img { width: 100%; display: block; border-radius: 4px; transition: transform 0.2s; cursor: zoom-in; }
        .photo-card img:hover { transform: scale(1.01); }

        .exif-data { font-family: ui-monospace, monospace; font-size: 0.75rem; color: #888; text-align: center; margin-top: 8px; letter-spacing: 0.05em; }

        /* --- Pagination --- */
        .pagination { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin: 40px 0 20px 0; font-family: ui-monospace, monospace; }
        .page-btn, .page-link { color: #fff; text-decoration: none; padding: 8px 14px; border: 1px solid #333; border-radius: 4px; transition: all 0.2s; font-size: 0.85rem; }
        .page-btn:hover, .page-link:hover { background: #333; border-color: #555; }
        .page-link.active { background: #fff; color: #111; border-color: #fff; font-weight: bold; }
        .ellipsis { color: #888; font-size: 0.85rem; padding: 0 4px; }

        /* --- Lightbox --- */
        .lightbox { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; cursor: zoom-out; }
        .lightbox.active { display: flex; opacity: 1; }
        .lightbox img { max-width: 95%; max-height: 95vh; border-radius: 4px; box-shadow: 0 4px 30px rgba(0,0,0,0.5); object-fit: contain; }
    </style>
</head>
<body>
    <div class="tabs">
        <!-- TABS_CONTENT -->
    </div>

    <div class="masonry">
        <!-- GALLERY_CONTENT -->
    </div>

    <div class="pagination">
        <!-- PAGINATION_CONTENT -->
    </div>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="Vue en plein écran">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        document.querySelector('.masonry').addEventListener('click', function(e) {
            if(e.target.tagName === 'IMG') {
                lightboxImg.src = e.target.src;
                lightbox.style.display = 'flex';
                setTimeout(() => lightbox.classList.add('active'), 10);
            }
        });
        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
            setTimeout(() => lightbox.style.display = 'none', 300);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape" && lightbox.classList.contains('active')) {
                lightbox.classList.remove('active');
                setTimeout(() => lightbox.style.display = 'none', 300);
            }
        });
    </script>
</body>
</html>
